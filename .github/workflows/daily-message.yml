name: Enviar Mensaje Diario al Canal Akomo

on:
  schedule:
    # Ejecutar todos los días a las 9:00 AM Colombia (UTC-5 = 14:00 UTC)
    - cron: '0 14 * * *'
  
  # Permite ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  send-daily-message:
    runs-on: ubuntu-latest
    
    steps:
      - name: Obtener fecha y hora actual
        id: datetime
        run: |
          echo "date=$(TZ='America/Bogota' date '+%A, %d de %B de %Y')" >> $GITHUB_OUTPUT
          echo "time=$(TZ='America/Bogota' date '+%H:%M')" >> $GITHUB_OUTPUT
      
      - name: Enviar mensaje al canal Akomo
        id: send
        env:
          API_URL: ${{ secrets.FONDIKA_API_URL }}
          API_KEY: ${{ secrets.FONDIKA_API_KEY }}
          CANAL_ID: ${{ secrets.CANAL_AKOMO_ID }}
        run: |
          MESSAGE="📅 Mensaje Diario Automático\n\n🗓️ ${{ steps.datetime.outputs.date }}\n🕐 ${{ steps.datetime.outputs.time }}\n\n✅ Sistema fondika-go operativo\n✅ Conexión WhatsApp activa\n✅ Canal Akomo funcionando correctamente\n\nEnviado automáticamente por GitHub Actions"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL/send/text" \
            -H "Content-Type: application/json" \
            -H "apikey: $API_KEY" \
            -d "{
              \"number\": \"$CANAL_ID\",
              \"text\": \"$MESSAGE\"
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "response=$BODY" >> $GITHUB_OUTPUT
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body:"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Verificar resultado
        if: steps.send.outputs.http_code != '200'
        run: |
          echo "❌ Error: El mensaje no se envió correctamente"
          echo "HTTP Code: ${{ steps.send.outputs.http_code }}"
          echo "Response: ${{ steps.send.outputs.response }}"
          exit 1
      
      - name: Confirmar éxito
        if: steps.send.outputs.http_code == '200'
        run: |
          echo "✅ ¡Mensaje enviado exitosamente!"
          echo "Fecha: ${{ steps.datetime.outputs.date }}"
          echo "Hora: ${{ steps.datetime.outputs.time }}"
